name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Next 16 generates the route and layout types (LayoutProps, etc.) that
      # app/layout.tsx uses. tsc cannot see them on a clean checkout, so
      # generate them before typecheck rather than relying on a local .next.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run test
