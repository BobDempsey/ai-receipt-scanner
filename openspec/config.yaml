schema: spec-driven

context: |
  Read handoff.md at the repo root before proposing or applying anything. It
  carries the decisions, the gotchas and the outstanding work, and it wins over
  any assumption drawn from the code.

  Build in vertical slices. Each change is one thin path through every layer
  (upload, model call, validation, form, export) that runs end to end in the
  deployed app, not one layer across every feature. Do not widen a slice that
  does not yet work.

  Stack is fixed: Next.js 16.3.8 with the App Router, React 19, TypeScript,
  Mantine for UI with its PostCSS preset, Zod shared between client and server,
  OpenAI API with Structured Outputs in strict mode, tesseract.js and pdf.js
  for OCR word boxes, IndexedDB for session state, Vercel for hosting.
  Mantine replaces Tailwind rather than sitting beside it.

  Nothing is stored server-side except rate-limit counters. Uploads live in
  memory for the length of the request. Extracted results live in the browser.

  Money is a decimal string, never a float. Arithmetic is checked in code and a
  mismatch is surfaced as a warning naming the difference, never corrected
  silently. Field highlighting is matched against OCR word boxes, never
  generated by the model, and no match means no highlight rather than a wrong
  one.

  Never delete, empty or overwrite an existing file to make room for generated
  code. When a generator wants a clean directory, generate into a sibling
  temporary directory and copy the files in.

  Prose rules for every artifact, README and comment: no em dashes, no
  "not just X, it's Y" reversals, active voice with a named actor. Commit
  messages and PR bodies never mention an AI tool.

rules:
  tasks:
    - State which vertical slice the change belongs to.
    - Every slice ends with a task that verifies it end to end in the running app.
